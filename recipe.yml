name: 'Web Dashboard'
description: 'The default dashboards of the Webship site templates, built with Display Builder: a Webmaster dashboard for site administrators and an Editorial dashboard for content editors.'
type: 'Administration'
install:
  - node
  - user
  - views
  - display_builder
  - webdashboard
  - webdashboard_views
config:
  strict: false
  import:
    # Optional config and the config entities of modules installed by a recipe
    # are not created from the module config directories: the Display Builder
    # profile of the dashboards and the views they embed.
    display_builder:
      - display_builder.profile.default
      - filter.format.display_builder_html
    webdashboard_views:
      - views.view.webdashboard_last_content
    user:
      - views.view.who_s_online
  actions:
    # The Dashboards toolbar tab opens the dashboard with the lowest weight the
    # user can view. Webmaster (-20) is the default of site administrators,
    # Editorial (-10) the default of content editors. Management (-5) is for
    # site administrators, and for the roles given its permission.
    ?user.role.content_editor:
      grantPermissions:
        - 'can view editorial webdashboard'
