langcode: en
status: true
dependencies:
  config:
    - display_builder.profile.default
    - views.view.webdash_content
  module:
    - ui_patterns
    - views
    - webdashboard
id: editorial
admin_label: Editorial
category: General
frontend: false
weight: -10
profile: default
sources:
  -
    node_id: editorial_welcome
    source_id: block
    source:
      plugin_id: 'webdashboard_item:welcome'
      'webdashboard_item:welcome':
        label: ''
        label_display: '0'
  -
    node_id: editorial_overview
    source_id: block
    source:
      plugin_id: 'webdashboard_item:site_overview'
      'webdashboard_item:site_overview':
        label: ''
        label_display: '0'
  -
    node_id: editorial_layout
    source_id: component
    source:
      component:
        component_id: 'webdashboard:dashboard_two_one'
        props:
          reverse:
            source_id: checkbox
            source:
              value: true
        slots:
          one:
            sources:
              -
                node_id: editorial_add_content
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:add_content_menu'
                  'webdashboard_item:add_content_menu':
                    label: 'Add content'
                    label_display: visible
                    include_destination: false
                    items: {  }
              -
                node_id: editorial_quick_tasks
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:quick_tasks'
                  'webdashboard_item:quick_tasks':
                    label: 'Quick tasks'
                    label_display: visible
          two:
            sources: {  }
          three:
            sources:
              -
                node_id: editorial_my_drafts
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:view_embed'
                  'webdashboard_item:view_embed':
                    label: 'My drafts'
                    label_display: visible
                    view: 'webdash_content:block_my_drafts'
              -
                node_id: editorial_my_content
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:view_embed'
                  'webdashboard_item:view_embed':
                    label: 'My content'
                    label_display: visible
                    view: 'webdash_content:block_my_content'
              -
                node_id: editorial_recent_content
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:view_embed'
                  'webdashboard_item:view_embed':
                    label: 'Recent content'
                    label_display: visible
                    view: 'webdash_content:block_recent'
