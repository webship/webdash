langcode: en
status: true
dependencies:
  config:
    - display_builder.profile.default
    - views.view.webdashboard_last_content
    - views.view.who_s_online
  module:
    - ui_patterns
    - views
    - webdashboard
id: webmaster
admin_label: Webmaster
category: General
frontend: false
weight: -20
profile: default
sources:
  -
    node_id: webmaster_layout
    source_id: component
    source:
      component:
        component_id: 'webdashboard:dashboard_two_one'
        props:
          reverse:
            source_id: checkbox
            source:
              value: true
        slots:
          one:
            sources:
              -
                node_id: webmaster_site_status
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:system_info'
                  'webdashboard_item:system_info':
                    label: 'Site status'
                    label_display: visible
          two:
            sources:
              -
                node_id: webmaster_who_s_online
                source_id: block
                source:
                  plugin_id: 'views_block:who_s_online-who_s_online_block'
                  'views_block:who_s_online-who_s_online_block':
                    label: ''
                    label_display: visible
                    views_label: ''
                    items_per_page: none
          three:
            sources:
              -
                node_id: webmaster_content
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:node_statistics'
                  'webdashboard_item:node_statistics':
                    label: Content
                    label_display: visible
                    chart_type: bar
              -
                node_id: webmaster_recent_content
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:view_embed'
                  'webdashboard_item:view_embed':
                    label: 'Recent content'
                    label_display: visible
                    view: 'webdashboard_last_content:embed_1'
