langcode: en
status: true
dependencies:
  config:
    - display_builder.profile.default
    - views.view.webdash_content
    - views.view.who_s_online
  module:
    - ui_patterns
    - views
    - webdashboard
id: webmaster
admin_label: Webmaster
category: General
frontend: false
weight: -20
profile: default
sources:
  -
    node_id: webmaster_welcome
    source_id: block
    source:
      plugin_id: 'webdashboard_item:welcome'
      'webdashboard_item:welcome':
        label: ''
        label_display: '0'
  -
    node_id: webmaster_overview
    source_id: block
    source:
      plugin_id: 'webdashboard_item:site_overview'
      'webdashboard_item:site_overview':
        label: ''
        label_display: '0'
  -
    node_id: webmaster_layout
    source_id: component
    source:
      component:
        component_id: 'webdashboard:dashboard_two_one'
        props:
          reverse:
            source_id: checkbox
            source:
              value: true
        slots:
          one:
            sources:
              -
                node_id: webmaster_quick_tasks
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:quick_tasks'
                  'webdashboard_item:quick_tasks':
                    label: 'Quick tasks'
                    label_display: visible
              -
                node_id: webmaster_site_status
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:system_info'
                  'webdashboard_item:system_info':
                    label: 'Site status'
                    label_display: visible
          two:
            sources:
              -
                node_id: webmaster_content
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:node_statistics'
                  'webdashboard_item:node_statistics':
                    label: 'Content by type'
                    label_display: visible
                    chart_type: doughnut
              -
                node_id: webmaster_who_s_online
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:view_embed'
                  'webdashboard_item:view_embed':
                    label: "Who's online"
                    label_display: visible
                    view: 'who_s_online:who_s_online_block'
          three:
            sources:
              -
                node_id: webmaster_recent_content
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:view_embed'
                  'webdashboard_item:view_embed':
                    label: 'Recent content'
                    label_display: visible
                    view: 'webdash_content:block_recent'
              -
                node_id: webmaster_my_drafts
                source_id: block
                source:
                  plugin_id: 'webdashboard_item:view_embed'
                  'webdashboard_item:view_embed':
                    label: 'My drafts'
                    label_display: visible
                    view: 'webdash_content:block_my_drafts'
